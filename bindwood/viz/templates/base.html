<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}bindwood viz{% endblock %}</title>
    <style>
        :root {
            --bg:       #f7f8fa;
            --panel:    #ffffff;
            --border:   #e4e6eb;
            --text:     #1f2328;
            --muted:    #5f6672;
            --accent:   #4f46e5;
            --accent-b: #e0e7ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            padding: 14px 28px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: baseline; gap: 16px;
        }
        header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        header .sub {
            color: var(--muted);
            font-size: 13px;
        }
        nav.tabs {
            padding: 0 28px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            display: flex; gap: 4px;
        }
        nav.tabs a {
            display: inline-block;
            padding: 10px 16px;
            text-decoration: none;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            font-size: 14px;
        }
        nav.tabs a.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: var(--accent-b);
        }
        nav.tabs a:hover { color: var(--accent); }
        main {
            padding: 20px 28px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px;
            margin-bottom: 16px;
        }
        .card h2 { margin: 0 0 12px 0; font-size: 16px; }
        a.target-link {
            display: inline-block;
            padding: 6px 12px;
            margin: 4px 4px 0 0;
            border-radius: 16px;
            background: var(--accent-b);
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
        }
        a.target-link:hover { text-decoration: underline; }
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
        }
        td, th {
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--muted); font-weight: 500; }
    </style>
</head>
<body>
    <header>
        <h1>bindwood</h1>
        <span class="sub">{{ db_path }}</span>
    </header>
    {% block subnav %}{% endblock %}
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>

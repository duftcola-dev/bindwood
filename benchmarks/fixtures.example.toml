# Benchmark fixture configuration.
#
# Copy this file to benchmarks/fixtures.toml and edit the values.
#
# The bindwood MCP server resolves its own database from your bindwood config,
# so there's no db_path here — the harness just spawns `bindwood mcp` and
# bindwood does the rest. Run `bindwood list` to see the targets available
# and confirm each one below matches.
#
# `path` is the project root for code targets and the .sql file for DDL.

# ── DDL ──────────────────────────────────────────────────────
[[repos]]
name    = "ddl1"
type    = "ddl"
path    = "/home/robin/Repositories/Samples/DDL/ddl1.sql"
target  = "ddl1"

[[repos]]
name    = "ddl2"
type    = "ddl"
path    = "/home/robin/Repositories/Samples/DDL/ddl2.sql"
target  = "ddl2"

[[repos]]

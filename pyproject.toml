[project]
name = "bindwood"
version = "0.3.0"
description = "Scan codebases into a queryable graph + vector index. MCP and HTTP servers for LLM consumption."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "Robin Viera Acosta", email = "robinviera@hotmail.com" },
]
keywords = ["code-graph", "static-analysis", "tree-sitter", "mcp", "llm", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "blessed>=1.38.0",
    "click>=8.3.2",
    "mcp>=1.27.0",
    "python-dotenv>=1.2.2",
    "sqlglot>=30.2.1",
    "sqlite-vec>=0.1.9",
    "tree-sitter>=0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
http = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
viz = [
    "bindwood[http]",
    "jinja2>=3.1",
    "plotly>=5.20",
    "networkx>=3.2",
    "numpy>=1.26",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10.11",
    "mike>=2.1",
]

[project.urls]
Homepage = "https://github.com/robinviera/bindwood"
Documentation = "https://github.com/robinviera/bindwood#readme"
Issues = "https://github.com/robinviera/bindwood/issues"

[project.scripts]
bindwood = "bindwood.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bindwood"]
